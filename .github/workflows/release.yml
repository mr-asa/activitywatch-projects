name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node scripts/build-release.mjs --tag "$GITHUB_REF_NAME"
      - run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          --title "$GITHUB_REF_NAME"
          dist/activitywatch-projects.zip dist/activitywatch-projects.zip.sha256 dist/install.ps1
        env:
          GH_TOKEN: ${{ github.token }}
